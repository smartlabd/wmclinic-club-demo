<title>WMClinic Club</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@300;400;500;600&family=Josefin+Sans:wght@300;400;600&display=swap">
<style>
/* Layout: phone-shaped app centered on desktop, edge to edge on phones; black and metallic gold taken from the WMClinic logo */
:root{
  color-scheme:dark;
  --bg:#0a0a0b;
  --surface:#141416;
  --surface-2:#1c1c1f;
  --line:rgba(201,162,75,.2);
  --line-soft:rgba(255,255,255,.07);
  --text:#f3eee2;
  --muted:#a39c8c;
  --gold:#c9a24b;
  --gold-hi:#f1d58a;
  --gold-lo:#8a6a26;
  --on-gold:#17120a;
  --ok:#7fbf8f;
  --warn:#e0b25c;
  --bad:#d98a7a;
  --gold-grad:linear-gradient(120deg,#8a6a26 0%,#e9cb7e 38%,#b8903a 62%,#f1d58a 100%);
  --f-display:"Cormorant Garamond",Georgia,serif;
  --f-caps:"Josefin Sans","Jost",system-ui,sans-serif;
  --f-body:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:20px;background:radial-gradient(900px 500px at 50% -10%,rgba(201,162,75,.12),transparent 60%),var(--bg)}
.cap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-family:var(--f-caps);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cap button{border:1px solid var(--line);padding:6px 12px;border-radius:99px;color:var(--gold-hi);letter-spacing:.14em}
.phone{position:relative;width:392px;max-width:100%;height:min(820px,calc(100vh - 100px));min-height:620px;background:var(--bg);border:1px solid var(--line);border-radius:38px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 6px #050505,0 0 0 7px var(--line)}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 20px 24px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
@media(max-width:520px){
  .stage{padding:0;gap:0;justify-content:flex-start}
  .cap{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none}
}
/* type */
.caps{font-family:var(--f-caps);font-size:11px;font-weight:400;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:600;letter-spacing:.005em;text-wrap:balance}
h1{font-size:34px;line-height:1.05}
h2{font-size:24px;line-height:1.15}
h3{font-size:19px;line-height:1.2}
p{margin:0}
.gold{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:40px;height:40px;border-radius:50%;display:block}
.brand b{font-family:var(--f-caps);font-weight:600;letter-spacing:.22em;font-size:12px}
.brand small{display:block;font-family:var(--f-caps);font-weight:300;letter-spacing:.3em;font-size:9px;color:var(--gold)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--gold-hi);position:relative;flex:none}
.dot{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--gold-hi)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 12px}
.sec button{font-family:var(--f-caps);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
/* membership card */
.mcard{position:relative;border-radius:22px;padding:20px 20px 18px;background:var(--gold-grad);color:var(--on-gold);overflow:hidden;isolation:isolate}
.mcard::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(240px 140px at 85% -10%,rgba(255,255,255,.45),transparent 60%)}
.mcard .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.mcard .caps{color:rgba(23,18,10,.72)}
.mcard .tier{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.mcard .big{font-family:var(--f-display);font-size:46px;font-weight:700;line-height:.9}
.mcard .foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:22px}
.mcard .chipx{border:1px solid rgba(23,18,10,.35);border-radius:99px;padding:4px 10px;font-family:var(--f-caps);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.bar{height:5px;border-radius:9px;background:rgba(23,18,10,.2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--on-gold);border-radius:9px}
/* cards & lists */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.svc{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:12px;width:100%}
.svc:hover{border-color:var(--line)}
.tile{width:62px;height:62px;border-radius:14px;flex:none;display:grid;place-items:center;color:var(--gold-hi);background:radial-gradient(circle at 30% 20%,rgba(241,213,138,.22),rgba(201,162,75,.04) 60%),var(--surface-2);border:1px solid var(--line)}
.svc .body{min-width:0;flex:1}
.svc .t{font-weight:500;font-size:16px}
.svc .m{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--muted);font-size:13px;margin-top:3px}
.cr{font-family:var(--f-caps);font-size:11px;letter-spacing:.1em;color:var(--gold-hi);border:1px solid var(--line);padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill{font-family:var(--f-caps);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}.pill.mut{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-inline:-20px;padding-inline:20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--line-soft);font-family:var(--f-caps);font-size:12px;letter-spacing:.08em;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold);border-color:transparent;font-weight:600}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.rec{flex:none;width:232px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.rec .why{font-size:13px;color:var(--muted);flex:1}
.rec .why em{font-style:normal;color:var(--gold-hi)}
.next{display:flex;gap:14px;align-items:center;width:100%}
.date{flex:none;width:58px;border-radius:14px;border:1px solid var(--line);padding:8px 0;text-align:center}
.date b{display:block;font-family:var(--f-display);font-size:28px;line-height:1}
.date span{font-family:var(--f-caps);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px 18px;border-radius:14px;font-family:var(--f-caps);font-weight:600;font-size:13px;letter-spacing:.16em;text-transform:uppercase;background:var(--gold-grad);color:var(--on-gold);text-align:center}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--gold-hi)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{width:auto;padding:10px 16px;font-size:11px}
.btn-row{display:flex;gap:10px}
.promo{border-radius:18px;padding:18px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(201,162,75,.16),rgba(201,162,75,.02)),var(--surface);display:flex;gap:14px;align-items:center}
/* nav */
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line-soft);background:rgba(10,10,11,.96);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;color:var(--muted);font-family:var(--f-caps);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.nav button[aria-current="page"]{color:var(--gold-hi)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.66);animation:fade .2s both}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--line);border-radius:26px 26px 0 0;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:10px auto 0;flex:none}
.sheet .sh-head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;gap:12px}
.sheet .sh-body{overflow-y:auto;padding:8px 20px 14px;scrollbar-width:none}
.sheet .sh-foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line-soft)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.days{display:flex;gap:8px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:56px;padding:10px 0;border-radius:14px;border:1px solid var(--line-soft);text-align:center}
.day span{display:block;font-family:var(--f-caps);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.day b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.day[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold);border-color:transparent}
.day[aria-pressed="true"] span{color:rgba(23,18,10,.7)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:12px 4px;border-radius:12px;border:1px solid var(--line-soft);text-align:center;font-size:14px}
.slot[aria-pressed="true"]{background:var(--gold-grad);color:var(--on-gold);border-color:transparent;font-weight:600}
.slot[disabled]{opacity:.3;text-decoration:line-through;cursor:not-allowed}
.pro{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border-radius:14px;border:1px solid var(--line-soft)}
.pro[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,162,75,.08)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--on-gold);background:var(--gold-grad)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{text-align:right}
.ticks{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ticks svg{color:var(--gold);flex:none;margin-top:2px}
textarea{width:100%;min-height:76px;resize:none;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;color:var(--text);font:inherit;padding:12px}
.plan{border:1px solid var(--line-soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;width:100%}
.plan[aria-current="true"]{border-color:var(--gold);background:rgba(201,162,75,.07)}
.plan .price{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.success{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px 0 6px}
.seal{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--gold-grad);color:var(--on-gold)}
.toast{position:absolute;left:20px;right:20px;bottom:88px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px 16px;font-size:14px;animation:up .25s both;z-index:5}
.tabs{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line-soft);border-radius:14px;padding:4px;margin:16px 0}
.tabs button{padding:9px;text-align:center;border-radius:10px;font-family:var(--f-caps);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface-2);color:var(--gold-hi)}
.toggle{width:46px;height:26px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .2s}
.toggle[aria-pressed="true"]{background:rgba(201,162,75,.25)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px);background:var(--gold-hi)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="stage">
  <div class="cap"><span>Prototipo navegable · datos de ejemplo</span><button data-a="reset">Reiniciar</button></div>
  <div class="phone"><div id="app"></div></div>
</div>

function apptCard(a){

}

/* ---------- sheets ---------- */
function sheetShell(title,body,foot,back){
 return '<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="'+title+'"><div class="grab"></div><div class="sh-head"><div style="display:flex;align-items:center;gap:8px;min-width:0">'+(back?'<button class="iconbtn" style="width:34px;height:34px" data-a="back" aria-label="Volver"><span style="transform:rotate(180deg);display:grid">'+ic('chev',16)+'</span></button>':'')+'<div class="caps">'+title+'</div></div><button class="iconbtn" style="width:34px;height:34px" data-a="close" aria-label="Cerrar">'+ic('close',16)+'</button></div><div class="sh-body">'+body+'</div>'+(foot?'<div class="sh-foot">'+foot+'</div>':'')+'</div>';
}
function dateOptions(){var o=[],i=1;while(o.length<14){var d=addD(T0,i++);if(d.getDay()!==0)o.push(d)}return o}
function slotOff(d,i){return (d.getDate()*7+i*3)%5===0}

 if(sh.type==='plans'){
  var b='<h2 style="margin:6px 0 4px">Elige tu plan</h2><p class="muted" style="margin-bottom:14px">El cambio aplica desde hoy y se ajusta tu saldo.</p><div class="list">';
  PLANS.forEach(function(p){var cur=p.id===S.plan;
   b+='<button class="plan" aria-current="'+cur+'" data-a="choose" data-v="'+p.id+'"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h3>'+p.n+'</h3><div class="caps" style="margin-top:4px">'+p.cr+' créditos al mes</div></div><div style="text-align:right"><div class="price num">$'+p.price+'</div><div class="muted" style="font-size:12px">al mes</div></div></div><ul class="ticks">'+p.perks.map(function(x){return '<li>'+ic('check',16)+'<span>'+x+'</span></li>'}).join('')+'</ul>'+(cur?'<span class="pill ok" style="align-self:flex-start">Tu plan actual</span>':'')+'</button>'});
  return sheetShell('Planes',b+'</div>','',false);
 }
 if(sh.type==='cancel'){
  var a=S.appts.filter(function(x){return x.id===sh.id})[0],s=SV[a.s],ref=a.st==='confirmada'?s.cr:0;
  var b2='<h2 style="margin:6px 0 8px">'+(a.st==='pendiente'?'¿Retirar la solicitud?':'¿Cancelar esta cita?')+'</h2><p class="muted">'+s.n+' · '+fLong(a.d)+' · '+a.t+'</p>'+(ref?'<div class="card" style="margin-top:16px;display:flex;gap:10px;align-items:center"><span style="color:var(--gold-hi)">'+ic('check',18)+'</span><span>Se te devuelven <b>'+ref+' créditos</b>. Cancelas sin costo hasta 24 horas antes.</span></div>':'');
  return sheetShell('Cancelar',b2,'<div class="btn-row"><button class="btn ghost" data-a="close">Mantener</button><button class="btn" data-a="cancelyes" data-v="'+a.id+'">Sí, cancelar</button></div>',false);
 }
 var s=SV[sh.svc],ev=s.mode==='eval',enough=S.credits>=s.cr||ev,step=sh.step,b3='',f='',ttl=ev?'Solicitud':'Reserva';
 if(step===0){
  b3='<div style="display:flex;gap:14px;align-items:center;margin:6px 0 14px"><div class="tile" style="width:72px;height:72px;border-radius:18px">'+ic(CATICON[s.cat],34)+'</div><div style="min-width:0"><div class="caps">'+s.cat+'</div><h2 style="margin-top:2px">'+s.n+'</h2></div></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="cr">'+s.cr+' créditos</span><span class="cr">'+s.min+' min</span>'+(ev?'<span class="pill warn">Con valoración</span>':'<span class="pill ok">Reserva directa</span>')+'</div>'+
   '<p>'+s.d+'</p><div class="sec" style="margin:20px 0 10px"><div class="caps">Incluye</div></div><ul class="ticks">'+s.inc.map(function(x){return '<li>'+ic('check',18)+'<span>'+x+'</span></li>'}).join('')+'</ul>'+
   (ev?'<div class="card" style="margin-top:18px;font-size:14px" ><span style="color:var(--gold-hi)">Cómo funciona.</span> Pides tu valoración, el equipo te confirma en menos de 24 horas y los créditos se usan cuando se define el tratamiento.</div>':'<p class="muted" style="margin-top:16px;font-size:14px">Tienes '+S.credits+' créditos. Después de reservar te quedan '+Math.max(0,S.credits-s.cr)+'.</p>');
  f=enough?'<button class="btn" data-a="step" data-v="1">'+(ev?'Solicitar valoración':'Elegir fecha y hora')+'</button>':'<button class="btn" data-a="plans">Créditos insuficientes · Ver planes</button>';
 }
 if(step===1){
  var ds=dateOptions();
  b3='<h2 style="margin:6px 0 4px">'+(ev?'Cuándo prefieres tu valoración':'Elige fecha y hora')+'</h2><p class="muted" style="margin-bottom:14px">'+s.n+'</p><div class="days">'+ds.map(function(d,i){return '<button class="day" aria-pressed="'+(sh.date===i)+'" data-a="date" data-v="'+i+'"><span>'+wd(d)+'</span><b class="num">'+d.getDate()+'</b><span>'+mo(d)+'</span></button>'}).join('')+'</div>';
  if(sh.date!=null){var d0=ds[sh.date];b3+='<div class="caps" style="margin:18px 0 10px">Horarios · '+fLong(d0)+'</div><div class="slots">'+SLOTS.map(function(t,i){var off=slotOff(d0,i);return '<button class="slot num" '+(off?'disabled ':'')+'aria-pressed="'+(sh.time===t)+'" data-a="time" data-v="'+t+'">'+t+'</button>'}).join('')+'</div>'}
  f='<button class="btn" '+(sh.date!=null&&sh.time?'':'disabled ')+'data-a="step" data-v="2">Continuar</button>';
 }
 if(step===2){
  var d1=dateOptions()[sh.date];
  b3='<h2 style="margin:6px 0 12px">Con quién</h2><div class="list">'+s.pros.map(function(k){var p=PROS[k];return '<button class="pro" aria-pressed="'+(sh.pro===k)+'" data-a="pro" data-v="'+k+'"><div class="avatar">'+p.i+'</div><div><div style="font-weight:500">'+p.n+'</div><div class="muted" style="font-size:13px">'+p.r+'</div></div></button>'}).join('')+'<button class="pro" aria-pressed="'+(sh.pro==='any')+'" data-a="pro" data-v="any"><div class="avatar" style="background:var(--surface-2);color:var(--gold-hi)">'+ic('star',20)+'</div><div><div style="font-weight:500">Sin preferencia</div><div class="muted" style="font-size:13px">El primero disponible</div></div></button></div>'+
  '<div class="caps" style="margin:20px 0 8px">Nota para el equipo (opcional)</div><textarea id="note" placeholder="Alergias, dudas o algo que debamos saber">'+(sh.note||'')+'</textarea>'+
  '<div class="card" style="margin-top:16px;padding:6px 16px"><div class="kv"><span>Servicio</span><span>'+s.n+'</span></div><div class="kv"><span>Fecha</span><span>'+fLong(d1)+'</span></div><div class="kv"><span>Hora</span><span>'+sh.time+'</span></div><div class="kv"><span>Costo</span><span>'+(ev?'Sin costo de créditos hoy':s.cr+' créditos')+'</span></div></div>';
  f='<button class="btn" '+(sh.pro?'':'disabled ')+'data-a="confirm">'+(ev?'Enviar solicitud':'Confirmar reserva')+'</button>';

 if(step===3){
  b3='<div class="success"><div class="seal">'+ic('check',34)+'</div><h2>'+(ev?'Solicitud enviada':'Reserva confirmada')+'</h2><p class="muted" style="max-width:280px">'+(ev?'El equipo de WMClinic te confirma la valoración por la app y WhatsApp en menos de 24 horas.':'Te esperamos. Recibirás un recordatorio el día anterior.')+'</p><div class="card" style="width:100%;text-align:left;margin-top:8px;padding:6px 16px"><div class="kv"><span>Servicio</span><span>'+s.n+'</span></div><div class="kv"><span>Fecha</span><span>'+fLong(sh.done.d)+'</span></div><div class="kv"><span>Hora</span><span>'+sh.done.t+'</span></div><div class="kv"><span>Sede</span><span>WMClinic · Caracas</span></div></div></div>';
  f='<button class="btn" data-a="finish">Ver mis citas</button>';
 }
 return sheetShell(ttl,b3,f,step===1||step===2);
}

/* ---------- render ---------- */
function render(){
 var sc=app.querySelector('.screen'),top=sc?sc.scrollTop:0,prevTab=app._tab;
 var body={inicio:homeScreen,servicios:servScreen,citas:citasScreen,club:clubScreen,perfil:perfilScreen}[S.tab]();
 var nav=[['inicio','home','Inicio'],['servicios','spark','Servicios'],['citas','cal','Citas'],['club','crown','Club'],['perfil','user','Perfil']];
 app.innerHTML='<div class="screen">'+body+'</div><nav class="nav" aria-label="Principal">'+nav.map(function(n){return '<button data-a="tab" data-v="'+n[0]+'"'+(S.tab===n[0]?' aria-current="page"':'')+'>'+ic(n[1],22)+'<span>'+n[2]+'</span></button>'}).join('')+'</nav>'+sheetView()+(S.toast?'<div class="toast" role="status">'+S.toast+'</div>':'');
 var ns=app.querySelector('.screen');if(prevTab===S.tab&&ns)ns.scrollTop=top;app._tab=S.tab;
}
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(function(){S.toast=null;render()},2600)}
function go(tab){S.tab=tab;S.sheet=null;render();var sc=app.querySelector('.screen');if(sc)sc.scrollTop=0}

app.addEventListener('input',function(e){if(e.target.id==='note'&&S.sheet)S.sheet.note=e.target.value});
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;
 var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),sh=S.sheet;
 if(a==='reset'){S=fresh();render();return}
 if(!app.contains(el))return;
 switch(a){
  case 'tab':go(v);break;
  case 'cat':S.cat=v;go('servicios');break;
  case 'tc':S.tabCitas=v;render();break;
  case 'open':S.sheet={svc:v,step:0,date:null,time:null,pro:null,note:''};render();break;
  case 'step':sh.step=parseInt(v,10);render();break;
  case 'back':sh.step-=1;render();break;
  case 'date':sh.date=parseInt(v,10);sh.time=null;render();break;
  case 'time':sh.time=v;render();break;
  case 'pro':sh.pro=v;render();break;
  case 'confirm':
   var s=SV[sh.svc],d=dateOptions()[sh.date],pk=sh.pro==='any'?s.pros[0]:sh.pro;
   S.appts.push({id:uid++,s:s.id,d:d,t:sh.time,p:pk,st:s.mode==='eval'?'pendiente':'confirmada'});
   if(s.mode==='direct')S.credits-=s.cr;
   sh.done={d:d,t:sh.time};sh.step=3;render();break;
  case 'finish':S.tabCitas='prox';go('citas');break;
  case 'close':S.sheet=null;render();break;
  case 'cancel':S.sheet={type:'cancel',id:parseInt(v,10)};render();break;
  case 'cancelyes':
   var ap=S.appts.filter(function(x){return x.id===parseInt(v,10)})[0];
   if(ap.st==='confirmada')S.credits+=SV[ap.s].cr;
   ap.st='cancelada';S.sheet=null;S.tabCitas='prox';toast('Cita cancelada');break;
  case 'plans':S.sheet={type:'plans'};render();break;
  case 'choose':
   var np=PLANS.filter(function(p){return p.id===v})[0],op=planOf();
   if(np.id!==op.id){S.credits=Math.max(0,S.credits+(np.cr-op.cr));S.plan=np.id;S.sheet=null;toast('Ahora eres socia '+np.n)}
   break;
  case 'notif':S.notif=!S.notif;render();break;
  case 'toast':toast(v);break;
 }
});
render();
})();
</script>
