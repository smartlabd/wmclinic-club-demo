<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WMClinic Club">
<title>WMClinic Club VIP</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500;600&display=swap">
<style>
/* Plan: obsidian base, champagne gold light, glass only where it carries information.
   One memorable element: the membership card (glass over drifting gold light, one sheen on load).
   Left aligned, sentence case, no eyebrows. Jost everywhere: light and tracked for headings, to echo the logo.
   Splash: the logo spins 270 degrees on its vertical axis while fading in, lands facing front, then the app appears. */
:root{
  color-scheme:dark;
  --obsidian:#08080b;
  --graphite:#121216;
  --ivory:#f4eddc;
  --mist:#a79f8e;
  --gold-hi:#f0d38a;
  --gold:#d9b560;
  --gold-lo:#8a6a26;
  --ok:#8fcaa0;
  --warn:#e6bd6a;
  --bad:#e09a88;
  --gold-grad:linear-gradient(120deg,#9b7a2e 0%,#f0d38a 40%,#c19a46 65%,#f6e0a4 100%);
  --edge:linear-gradient(140deg,rgba(240,211,138,.75),rgba(240,211,138,.10) 36%,rgba(240,211,138,.03) 64%,rgba(240,211,138,.4));
  --f-display:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--obsidian);color:var(--ivory);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;padding-block:20px;background:radial-gradient(900px 520px at 50% -10%,rgba(217,181,96,.14),transparent 60%),var(--obsidian)}
.cap{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--mist)}
.cap button{border:1px solid rgba(240,211,138,.25);padding:6px 14px;border-radius:99px;color:var(--gold-hi)}
.phone{position:relative;width:392px;max-width:100%;height:min(840px,calc(100vh - 96px));min-height:640px;background:var(--obsidian);border-radius:42px;overflow:hidden;box-shadow:0 0 0 7px #040406,0 0 0 8px rgba(240,211,138,.28),0 40px 90px rgba(0,0,0,.7)}
@media(max-width:520px){
  .stage{padding:0;gap:0;justify-content:flex-start}
  .cap{display:none}
  .phone{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;box-shadow:none}
}
/* light behind the glass */
.lights{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(46px);opacity:.55}
.orb.a{width:300px;height:300px;right:-90px;top:-60px;background:radial-gradient(circle,#d9b560 0%,rgba(217,181,96,0) 70%);animation:drift 26s ease-in-out infinite alternate}
.orb.b{width:340px;height:340px;left:-140px;top:42%;background:radial-gradient(circle,#8a6a26 0%,rgba(138,106,38,0) 70%);animation:drift 32s ease-in-out infinite alternate-reverse}
.orb.c{width:260px;height:260px;right:-60px;bottom:-60px;background:radial-gradient(circle,#b8903a 0%,rgba(184,144,58,0) 70%);opacity:.4;animation:drift 38s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-36px,48px)}}
#app{position:absolute;inset:0;display:flex;flex-direction:column}
.screen{position:relative;flex:1;overflow-y:auto;overflow-x:hidden;padding:calc(20px + env(safe-area-inset-top,0px)) 20px 120px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
/* glass */
.glass{position:relative;border-radius:var(--r,22px);background:linear-gradient(150deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 55%,rgba(255,255,255,.07));-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.28),0 18px 40px -14px rgba(0,0,0,.65)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:var(--edge);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
/* type */
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:300;letter-spacing:.05em;text-wrap:balance}
h3{font-weight:400;letter-spacing:.03em}
h1{font-size:32px;line-height:1.08}
h2{font-size:23px;line-height:1.15}
h3{font-size:18px;line-height:1.2}
p{margin:0}
.mist{color:var(--mist)}
.small{font-size:13px}
.gold-text{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.num{font-variant-numeric:tabular-nums}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who img{height:42px;width:auto;display:block;filter:drop-shadow(0 3px 6px rgba(0,0,0,.55))}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:var(--gold-hi);flex:none;position:relative;--r:50%}
.dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 8px var(--gold-hi)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 12px}
.sec button{font-size:13px;color:var(--gold-hi)}
/* membership card: the one memorable element */
.vip{--r:30px;padding:22px;overflow:hidden;background:linear-gradient(135deg,rgba(240,211,138,.30),rgba(240,211,138,.06) 48%,rgba(138,106,38,.28)),linear-gradient(150deg,rgba(255,255,255,.10),rgba(255,255,255,.03))}
.vip::after{content:"";position:absolute;top:-30%;bottom:-30%;width:42%;left:-60%;transform:skewX(-18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.34),transparent);animation:sheen 1.9s .5s ease-out 1 both;pointer-events:none}
@keyframes sheen{to{left:130%}}
.vip .row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vip .tier{font-family:var(--f-display);font-weight:300;letter-spacing:.07em;font-size:26px;line-height:1}
.vip .state{font-size:12px;color:var(--gold-hi);border:1px solid rgba(240,211,138,.4);padding:4px 11px;border-radius:99px}
.vip .big{font-family:var(--f-ui);font-weight:200;font-size:60px;line-height:.95;margin-top:26px;letter-spacing:-.02em}
.vip .big small{font-size:20px;font-weight:300;letter-spacing:0;color:var(--mist);-webkit-text-fill-color:var(--mist)}
.vip .meta{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-top:8px}
.vip .line{height:3px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:16px}
.vip .line i{display:block;height:100%;background:var(--gold-grad);border-radius:9px}
/* rows */
.list{display:flex;flex-direction:column;gap:12px}
.item{--r:22px;display:flex;gap:14px;align-items:center;padding:13px;width:100%}
.tile{width:58px;height:58px;border-radius:18px;flex:none;display:grid;place-items:center;color:var(--gold-hi);background:radial-gradient(circle at 30% 20%,rgba(240,211,138,.30),rgba(240,211,138,.04) 65%),rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(240,211,138,.25)}
.item .body{min-width:0;flex:1}
.item .t{font-weight:500;font-size:16px}
.item .m{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--mist);font-size:13px;margin-top:4px}
.credit{font-size:12px;color:var(--gold-hi);border:1px solid rgba(240,211,138,.35);padding:1px 9px;border-radius:99px;white-space:nowrap}
.sede-tag{font-size:11px;color:var(--ivory);background:rgba(255,255,255,.09);padding:1px 8px;border-radius:99px}
.status{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}.status.bad{color:var(--bad)}.status.mut{color:var(--mist)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 15px;border-radius:99px;font-size:14px;color:var(--mist);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.chip[aria-pressed="true"]{background:var(--gold-grad);color:#17120a;font-weight:600;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);--r:16px;padding:4px;gap:4px}
.seg button{padding:9px 4px;border-radius:12px;text-align:center;font-size:13px;color:var(--mist)}
.seg button[aria-pressed="true"]{background:rgba(240,211,138,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(240,211,138,.35)}
.search{--r:16px;display:flex;align-items:center;gap:10px;padding:0 14px;height:48px}
.search input{flex:1;background:none;border:0;min-width:0;height:100%}
.search input::placeholder{color:var(--mist)}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;padding-bottom:6px;scrollbar-width:none;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{display:none}
.rec{--r:24px;flex:none;width:236px;scroll-snap-align:start;padding:15px;display:flex;flex-direction:column;gap:12px}
.rec .why{font-size:13px;color:var(--mist);flex:1}
.cat{--r:22px;flex:none;width:98px;display:flex;flex-direction:column;align-items:center;gap:9px;padding:16px 8px;color:var(--gold-hi);font-size:13px}
.cat span{color:var(--ivory)}
.next{display:flex;gap:14px;align-items:center;width:100%;padding:14px}
.date{flex:none;width:58px;padding:9px 0;text-align:center;border-radius:16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(240,211,138,.3)}
.date b{display:block;font-family:var(--f-ui);font-weight:300;font-size:28px;line-height:1}
.date span{font-size:12px;color:var(--gold-hi)}
/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px 18px;border-radius:18px;font-weight:600;font-size:16px;background:var(--gold-grad);color:#17120a;text-align:center;box-shadow:0 10px 28px -10px rgba(217,181,96,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(240,211,138,.4)}
.btn.sm{width:auto;padding:10px 18px;font-size:14px;border-radius:14px}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn-row{display:flex;gap:10px}
.promo{--r:26px;padding:18px;display:flex;gap:14px;align-items:center}
/* floating tab bar */
.nav{position:absolute;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));--r:28px;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;z-index:3;background:linear-gradient(150deg,rgba(40,38,34,.62),rgba(20,19,18,.55))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:20px;color:var(--mist);font-size:11px}
.nav button[aria-current="page"]{color:var(--gold-hi);background:rgba(240,211,138,.13);box-shadow:inset 0 0 0 1px rgba(240,211,138,.3),0 0 20px -4px rgba(240,211,138,.4)}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .2s both;z-index:4}
.sheet{--r:30px;position:absolute;left:0;right:0;bottom:0;max-height:93%;display:flex;flex-direction:column;z-index:5;border-radius:30px 30px 0 0;background:linear-gradient(160deg,rgba(46,43,37,.88),rgba(18,17,16,.92));animation:up .28s cubic-bezier(.2,.8,.2,1) both}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:rgba(255,255,255,.25);margin:10px auto 0;flex:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;gap:12px}
.sh-body{overflow-y:auto;padding:8px 20px 14px;scrollbar-width:none}
.sh-foot{padding:12px 20px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.08)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.days{display:flex;gap:8px;overflow-x:auto;margin-inline:-20px;padding-inline:20px;padding-bottom:6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;width:56px;padding:10px 0;border-radius:16px;text-align:center;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.day span{display:block;font-size:12px;color:var(--mist)}
.day b{display:block;font-family:var(--f-ui);font-weight:400;font-size:23px;line-height:1.15}
.day[aria-pressed="true"]{background:var(--gold-grad);color:#17120a;box-shadow:none}
.day[aria-pressed="true"] span{color:rgba(23,18,10,.7)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{padding:13px 4px;border-radius:14px;text-align:center;font-size:14px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.slot[aria-pressed="true"]{background:var(--gold-grad);color:#17120a;font-weight:600;box-shadow:none}
.slot[disabled]{opacity:.28;text-decoration:line-through;cursor:not-allowed}
.opt{display:flex;gap:12px;align-items:center;width:100%;padding:13px;border-radius:18px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.09)}
.opt[aria-pressed="true"]{background:rgba(240,211,138,.12);box-shadow:inset 0 0 0 1px rgba(240,211,138,.6)}
.avatar{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:#17120a;background:var(--gold-grad)}
.avatar.soft{background:rgba(255,255,255,.08);color:var(--gold-hi)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--mist)}
.kv span:last-child{text-align:right}
.ticks{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ticks svg{color:var(--gold-hi);flex:none;margin-top:2px}
textarea{width:100%;min-height:78px;resize:none;background:rgba(255,255,255,.05);border:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);border-radius:16px;color:var(--ivory);font:inherit;padding:13px}
textarea:focus-visible{outline:2px solid var(--gold-hi)}
.plan{--r:24px;display:flex;flex-direction:column;gap:10px;width:100%;padding:16px}
.plan[aria-current="true"]{box-shadow:inset 0 0 0 1px rgba(240,211,138,.7),0 0 30px -8px rgba(240,211,138,.5)}
.price{font-family:var(--f-ui);font-weight:300;font-size:32px;line-height:1}
.success{text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 0 6px}
.seal{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--gold-grad);color:#17120a;box-shadow:0 0 40px -6px rgba(240,211,138,.7)}
.toast{position:absolute;left:20px;right:20px;bottom:104px;--r:18px;padding:13px 16px;font-size:14px;animation:up .25s both;z-index:6}
.tabs{display:grid;grid-template-columns:1fr 1fr;--r:16px;padding:4px;margin:16px 0}
.tabs button{padding:10px;text-align:center;border-radius:12px;font-size:14px;color:var(--mist)}
.tabs button[aria-pressed="true"]{background:rgba(240,211,138,.16);color:var(--gold-hi);box-shadow:inset 0 0 0 1px rgba(240,211,138,.35)}
.toggle{width:48px;height:28px;border-radius:99px;background:rgba(255,255,255,.1);position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:transform .2s}
.toggle[aria-pressed="true"]{background:rgba(240,211,138,.35)}
.toggle[aria-pressed="true"]::after{transform:translateX(20px);background:var(--gold-hi)}
.empty{--r:22px;padding:22px;text-align:left}
/* splash */
.splash{position:absolute;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;background:#000;animation:splashOut .8s 4.6s ease forwards}
.persp{position:relative;perspective:1000px;animation:fadein 1.3s ease-out both}
.coin{position:relative;width:190px;height:168px;transform-style:preserve-3d;animation:spin 3.6s cubic-bezier(.14,.78,.22,1) both}
.face{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden;filter:drop-shadow(0 8px 14px rgba(0,0,0,.55))}
.face.back{transform:rotateY(180deg)}
@keyframes spin{from{transform:rotateY(-270deg)}to{transform:rotateY(0deg)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.vip::after{display:none}}
.screen{padding-top:calc(20px + env(safe-area-inset-top,0px))}
html{-webkit-text-size-adjust:100%}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="24" y1="16" x2="232" y2="240"><stop offset="0" stop-color="#b8903a"/><stop offset=".48" stop-color="#f6e0a4"/><stop offset="1" stop-color="#c19a46"/></linearGradient></defs></svg>
<div class="stage">
  <div class="cap"><span>Prototipo con datos de ejemplo</span><button data-a="reload">Actualizar</button></div>
  <div class="phone"><div class="lights"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i></div><div id="app"></div>
  </div>
</div>

  var a=S.appts.filter(function(x){return x.id===sh.id})[0],s=SV[a.s],ref=a.st==='confirmada'?s.cr:0;
  var b2='<h2 style="margin:6px 0 8px">'+(a.st==='pendiente'?'¿Retirar la solicitud?':'¿Cancelar esta cita?')+'</h2><p class="mist">'+s.n+', '+fLong(a.d)+' a las '+a.t+'</p>'+(ref?'<div class="glass" style="--r:18px;margin-top:16px;display:flex;gap:10px;align-items:center;padding:14px"><span style="color:var(--gold-hi)">'+ic('check',18)+'</span><span>Te devolvemos <b>'+ref+' créditos</b>. Puedes cancelar sin costo hasta 24 horas antes.</span></div>':'');
  return shell('Cancelar',b2,'<div class="btn-row"><button class="btn ghost" data-a="close">Mantener cita</button><button class="btn" data-a="cancelyes" data-v="'+a.id+'">Cancelar</button></div>',false);
 }
 var s=SV[sh.svc],ev=s.mode==='eval',enough=S.credits>=s.cr||ev,step=sh.step,b3='',f='',ttl=ev?'Solicitud de valoración':'Reserva';
 if(step===0){
  b3='<div style="display:flex;gap:14px;align-items:center;margin:6px 0 14px"><div class="tile" style="width:72px;height:72px;border-radius:22px">'+ic(SICON[s.id],48)+'</div><div style="min-width:0"><div class="mist small">'+s.cat+'</div><h2 style="margin-top:2px">'+s.n+'</h2></div></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"><span class="credit">'+s.cr+' créditos</span><span class="credit">'+s.min+' minutos</span>'+(ev?'<span class="status warn">Con valoración</span>':'<span class="status ok">Reserva directa</span>')+'</div>'+
   '<p>'+s.d+'</p><h3 style="margin:22px 0 10px">Dónde y con quién</h3><div class="list" style="gap:8px">'+sedesOf(s).map(function(k){return '<div class="glass" style="--r:18px;padding:12px 14px"><div style="display:flex;gap:8px;align-items:center"><span style="color:var(--gold-hi)">'+ic('pin',18)+'</span><b style="font-weight:500">'+SEDES[k].n+'</b></div><div class="mist small" style="margin-top:5px">'+s.sedes[k].map(function(p){return PROS[p].n}).join(', ')+'</div></div>'}).join('')+'</div>'+
   '<h3 style="margin:22px 0 10px">Incluye</h3><ul class="ticks">'+s.inc.map(function(x){return '<li>'+ic('check',18)+'<span>'+x+'</span></li>'}).join('')+'</ul>'+
   (ev?'<div class="glass" style="--r:18px;margin-top:18px;padding:14px;font-size:14px"><span style="color:var(--gold-hi)">Así funciona.</span> Pides tu valoración, el equipo te confirma en menos de 24 horas y los créditos se usan cuando se define el tratamiento.</div>':'<p class="mist small" style="margin-top:16px">Tienes '+S.credits+' créditos. Después de reservar te quedan '+Math.max(0,S.credits-s.cr)+'.</p>');
  f=enough?'<button class="btn" data-a="step" data-v="1">'+(ev?'Solicitar valoración':'Elegir sede y médico')+'</button>':'<button class="btn" data-a="plans">Créditos insuficientes. Ver planes</button>';
 }
 if(step===1){
  b3='<h2 style="margin:6px 0 4px">¿Dónde te atiendes?</h2><p class="mist" style="margin-bottom:14px">'+s.n+'</p><div class="list" style="gap:8px">'+sedesOf(s).map(function(k){return '<button class="opt" aria-pressed="'+(sh.sede===k)+'" data-a="pick" data-v="'+k+'"><span style="color:var(--gold-hi)">'+ic('pin',22)+'</span><div><div style="font-weight:500">'+SEDES[k].n+'</div><div class="mist small">'+SEDES[k].d+'</div></div></button>'}).join('')+'</div>';
  if(sh.sede){b3+='<h3 style="margin:24px 0 10px">¿Con quién?</h3><div class="list" style="gap:8px">'+s.sedes[sh.sede].map(function(k){var p=PROS[k];return '<button class="opt" aria-pressed="'+(sh.pro===k)+'" data-a="pro" data-v="'+k+'"><div class="avatar">'+p.i+'</div><div><div style="font-weight:500">'+p.n+'</div><div class="mist small">'+p.r+'</div></div></button>'}).join('')+'<button class="opt" aria-pressed="'+(sh.pro==='any')+'" data-a="pro" data-v="any"><div class="avatar soft">'+ic('star',20)+'</div><div><div style="font-weight:500">Sin preferencia</div><div class="mist small">El primero disponible</div></div></button></div>'}
  f='<button class="btn" '+(sh.sede&&sh.pro?'':'disabled ')+'data-a="step" data-v="2">Elegir fecha y hora</button>';
 }
 if(step===2){
  var ds=dateOptions();
  b3='<h2 style="margin:6px 0 4px">'+(ev?'¿Cuándo prefieres tu valoración?':'Elige fecha y hora')+'</h2><p class="mist" style="margin-bottom:14px">'+s.n+', sede '+SEDES[sh.sede].n+'</p><div class="days">'+ds.map(function(d,i){return '<button class="day" aria-pressed="'+(sh.date===i)+'" data-a="date" data-v="'+i+'"><span>'+wd(d)+'</span><b class="num">'+d.getDate()+'</b><span>'+mo(d)+'</span></button>'}).join('')+'</div>';
  if(sh.date!=null){var d0=ds[sh.date];b3+='<h3 style="margin:20px 0 10px">'+fLong(d0)+'</h3><div class="slots">'+SLOTS.map(function(t,i){var off=slotOff(d0,i);return '<button class="slot num" '+(off?'disabled ':'')+'aria-pressed="'+(sh.time===t)+'" data-a="time" data-v="'+t+'">'+t+'</button>'}).join('')+'</div>'}
  f='<button class="btn" '+(sh.date!=null&&sh.time?'':'disabled ')+'data-a="step" data-v="3">Revisar</button>';
 }
 if(step===3){
  var d1=dateOptions()[sh.date],pk=sh.pro==='any'?s.sedes[sh.sede][0]:sh.pro;
  b3='<h2 style="margin:6px 0 12px">Revisa tu '+(ev?'solicitud':'reserva')+'</h2><div class="glass" style="--r:20px;padding:6px 16px"><div class="kv"><span>Servicio</span><span>'+s.n+'</span></div><div class="kv"><span>Sede</span><span>'+SEDES[sh.sede].n+'</span></div><div class="kv"><span>Médico</span><span>'+(sh.pro==='any'?'Primero disponible':PROS[pk].n)+'</span></div><div class="kv"><span>Fecha</span><span>'+fLong(d1)+'</span></div><div class="kv"><span>Hora</span><span>'+sh.time+'</span></div><div class="kv"><span>Costo</span><span>'+(ev?'Sin créditos por ahora':s.cr+' créditos')+'</span></div></div>'+
  '<h3 style="margin:20px 0 8px">Nota para el equipo</h3><textarea id="note" placeholder="Alergias, dudas o algo que debamos saber">'+(sh.note||'')+'</textarea>';
  f='<button class="btn" data-a="confirm">'+(ev?'Enviar solicitud':'Confirmar reserva')+'</button>';
 }
 if(step===4){
  b3='<div class="success"><div class="seal">'+ic('check',36)+'</div><h2>'+(ev?'Solicitud enviada':'Reserva confirmada')+'</h2><p class="mist" style="max-width:290px">'+(ev?'El equipo de WMClinic te confirma la valoración por la app y por WhatsApp en menos de 24 horas.':'Te esperamos. Recibirás un recordatorio el día anterior.')+'</p><div class="glass" style="--r:20px;width:100%;text-align:left;margin-top:8px;padding:6px 16px"><div class="kv"><span>Servicio</span><span>'+s.n+'</span></div><div class="kv"><span>Sede</span><span>'+SEDES[sh.done.sd].n+'</span></div><div class="kv"><span>Fecha</span><span>'+fLong(sh.done.d)+'</span></div><div class="kv"><span>Hora</span><span>'+sh.done.t+'</span></div></div></div>';
  f='<button class="btn" data-a="finish">Ver mis citas</button>';
 }
 return shell(ttl,b3,f,step>=1&&step<=3);
}

/* ---------- render ---------- */
function render(){
 var sc=app.querySelector('.screen'),top0=sc?sc.scrollTop:0,prev=app._tab;
 var body={inicio:homeScreen,servicios:servScreen,citas:citasScreen,club:clubScreen,perfil:perfilScreen}[S.tab]();
 var nav=[['inicio','home','Inicio'],['servicios','spark','Servicios'],['citas','cal','Citas'],['club','crown','Club'],['perfil','user','Perfil']];
 app.innerHTML='<div class="screen">'+body+'</div><nav class="nav glass" aria-label="Principal">'+nav.map(function(n){return '<button data-a="tab" data-v="'+n[0]+'"'+(S.tab===n[0]?' aria-current="page"':'')+'>'+ic(n[1],22)+'<span>'+n[2]+'</span></button>'}).join('')+'</nav>'+sheetView()+(S.toast?'<div class="toast glass" role="status">'+S.toast+'</div>':'');
 var ns=app.querySelector('.screen');if(prev===S.tab&&ns)ns.scrollTop=top0;app._tab=S.tab;
}
function toast(m){S.toast=m;render();clearTimeout(toastT);toastT=setTimeout(function(){S.toast=null;render()},2600)}
function go(tab){S.tab=tab;S.sheet=null;render();var sc=app.querySelector('.screen');if(sc)sc.scrollTop=0}

app.addEventListener('input',function(e){
 if(e.target.id==='note'&&S.sheet)S.sheet.note=e.target.value;
 if(e.target.id==='q'){S.q=e.target.value;var pos=e.target.selectionStart;render();var q=document.getElementById('q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(x){}}}
});
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-a]');if(!el)return;
 var a=el.getAttribute('data-a'),v=el.getAttribute('data-v'),sh=S.sheet;
 if(a==='reset'){S=fresh();render();return}
 if(!app.contains(el))return;
 switch(a){
  case 'tab':go(v);break;
  case 'cat':S.cat=v;go('servicios');break;
  case 'catset':S.cat=v;render();break;
  case 'sede':S.sede=v;render();break;
  case 'tc':S.tabCitas=v;render();break;
  case 'open':S.sheet={svc:v,step:0,sede:null,pro:null,date:null,time:null,note:''};render();break;
  case 'step':sh.step=parseInt(v,10);render();break;
  case 'back':sh.step-=1;render();break;
  case 'pick':sh.sede=v;sh.pro=null;render();break;
  case 'pro':sh.pro=v;render();break;
  case 'date':sh.date=parseInt(v,10);sh.time=null;render();break;
  case 'time':sh.time=v;render();break;
  case 'confirm':
   var s=SV[sh.svc],d=dateOptions()[sh.date],pk=sh.pro==='any'?s.sedes[sh.sede][0]:sh.pro;
   S.appts.push({id:uid++,s:s.id,d:d,t:sh.time,p:pk,sd:sh.sede,st:s.mode==='eval'?'pendiente':'confirmada'});
   if(s.mode==='direct')S.credits-=s.cr;
   sh.done={d:d,t:sh.time,sd:sh.sede};sh.step=4;render();break;
  case 'finish':S.tabCitas='prox';go('citas');break;
  case 'close':S.sheet=null;render();break;
  case 'cancel':S.sheet={type:'cancel',id:parseInt(v,10)};render();break;
  case 'cancelyes':
   var ap=S.appts.filter(function(x){return x.id===parseInt(v,10)})[0];
   if(ap.st==='confirmada')S.credits+=SV[ap.s].cr;
   ap.st='cancelada';S.sheet=null;S.tabCitas='prox';toast('Cita cancelada');break;
  case 'plans':S.sheet={type:'plans'};render();break;
  case 'choose':
   var np=PLANS.filter(function(p){return p.id===v})[0],op=planOf();
   if(np.id!==op.id){S.credits=Math.max(0,S.credits+(np.cr-op.cr));S.plan=np.id;S.sheet=null;toast('Ahora eres socia '+np.n)}
   break;
  case 'notif':S.notif=!S.notif;render();break;
  case 'toast':toast(v);break;
 }
});
render();
/* splash: el logo aparece y gira 270 grados sobre su eje vertical, luego entra la app.
   Se puede repetir con el botón Actualizar (arriba del teléfono) o desde Perfil. */
var splashTimer;
function splash(){
 var old=document.getElementById('splash');
 if(old&&old.parentNode)old.parentNode.removeChild(old);
 var el=document.createElement('div');
 el.className='splash';el.id='splash';el.setAttribute('aria-hidden','true');
 el.innerHTML='<div class="persp"><div class="coin"><img class="face" alt=""><img class="face back" alt=""></div></div>';
 [].forEach.call(el.querySelectorAll('img'),function(i){i.src=PURO});
 document.querySelector('.phone').appendChild(el);
 var calm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 clearTimeout(splashTimer);
 splashTimer=setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},calm?900:5600);
}
document.addEventListener('click',function(e){
 var b=e.target.closest('[data-a="reload"]');
 if(!b)return;
 S=fresh();render();splash();
});
splash();
})();
</script>
